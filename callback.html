
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LINE Redirect OK</title>
</head>
<body>
  <h2>LINE Redirect OK</h2>
  <p>Access token:</p>
  <pre id="token">Memuat...</pre>

  <script>
    const hash = window.location.hash;
    const params = new URLSearchParams(hash.slice(1));
    const token = params.get("access_token");
    document.getElementById("token").textContent = token || "Token tidak ditemukan di URL.";
  </script>
</body>
</html>
